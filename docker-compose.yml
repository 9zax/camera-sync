# CameraSync — docker compose
#
# หลักการ: ไฟล์ทั้งหมด (รูป, ฐานข้อมูล, โมเดล) อยู่ใน volume ./data ของเครื่องคุณเอง
# เปิดไว้ตลอด (restart: unless-stopped) แขกเข้าผ่าน http://<เครื่องคุณ>:8080
#
# ครั้งแรก:
#   docker compose build
#   docker compose run --rm models        # ดาวน์โหลดโมเดล face search (~280MB ครั้งเดียว)
#   docker compose up -d
#   เปิด http://localhost:8080/admin แล้วตั้ง user/pass ของตัวเอง
#
# hub บน server จริง (ให้เครื่องช่างภาพเชื่อมเข้ามา — hub ไม่เก็บภาพเด็ดขาด):
#   docker compose --profile hub up -d hub   # expose พอร์ต 9000
#   เครื่องช่างภาพ: wedsync tunnel --relay ws://<server>:9000 --user/--pass \
#        --server http://localhost:8080

services:
  camerasync:
    build: .
    image: camerasync:latest
    container_name: camerasync
    restart: unless-stopped # เปิดไว้ตลอด
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data # ดิสก์เครื่องคุณเองคือพื้นที่เก็บหลัก
    environment:
      FACE_THRESHOLD: ${FACE_THRESHOLD:-0.35}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      # ถ้าอยากให้ server อ่านโฟลเดอร์รูปในเครื่องตรง ๆ:
      # WEDSYNC_IMPORT_DIR: /app/data/inbox
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ดาวน์โหลดโมเดล face recognition ลง volume ครั้งเดียว (ไม่ auto-run)
  models:
    image: camerasync:latest
    build: .
    profiles: ["tools"]
    restart: "no"
    command: ["wedsync-server", "fetch-models"]
    volumes:
      - ./data:/app/data

  # hub — รันบน server จริง: บัญชี + tunnel + ลิงก์แขก /e/{slug}
  # เก็บเฉพาะบัญชี/ตาราง slug ใน ./hub-data — ไม่มีไฟล์ภาพถูกเขียนเด็ดขาด
  hub:
    image: camerasync:latest
    build: .
    profiles: ["hub"]
    restart: unless-stopped
    command: ["wedsync-server", "hub", "--port", "9000", "--data-dir", "/app/hub-data"]
    ports:
      - "9000:9000"
    volumes:
      - ./hub-data:/app/hub-data
