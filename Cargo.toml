[workspace]
resolver = "2"
members = ["crates/server", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4", "v7"] }
rand = "0.8"
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
