[package]
name = "camerasync-desktop"
description = "CameraSync desktop — the photographer's always-on machine (photo-drive server + hub tunnel)"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

wedsync-server = { path = "../../crates/server" }
wedsync-agent = { path = "../../crates/agent" }

[features]
default = []
