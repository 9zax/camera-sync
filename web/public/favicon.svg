<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CameraSync">
  <!-- CameraSync mark: aperture ring + heart shutter — wedding photos, live -->
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A0685F"/>
      <stop offset="1" stop-color="#7E4E49"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#cs-bg)"/>
  <circle cx="256" cy="252" r="122" fill="none" stroke="#FAF7F2" stroke-width="24"/>
  <!-- small sync dot on the ring (top-right) -->
  <circle cx="352" cy="180" r="26" fill="#E9C46A"/>
  <!-- heart shutter -->
  <path fill="#FAF7F2" d="M256 316
    C 212 283 186 258 186 228
    C 186 206 203 190 224 190
    C 238 190 249 197 256 209
    C 263 197 274 190 288 190
    C 309 190 326 206 326 228
    C 326 258 300 283 256 316 Z"/>
</svg>
