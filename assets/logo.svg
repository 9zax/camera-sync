<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CameraSync">
  <!-- CameraSync mark — "Aperture Heart": modern app icon on lacquer,
       six gold aperture blades around a gold heart, patina sync dot. -->
  <defs>
    <linearGradient id="csBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B231B"/>
      <stop offset="1" stop-color="#130F0B"/>
    </linearGradient>
    <radialGradient id="csGlow" cx="0.3" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#F0C97E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F0C97E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="csGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D488"/>
      <stop offset="0.5" stop-color="#E2B15C"/>
      <stop offset="1" stop-color="#B98A3F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#csBg)"/>
  <rect width="512" height="512" rx="118" fill="url(#csGlow)"/>
  <!-- six aperture blades (r=128, circumference 804 = 6 × [94 arc + 40 gap]) -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="url(#csGold)" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="94 40" stroke-dashoffset="20"/>
  <path fill="url(#csGold)" d="M256 312
    C 214 280 190 256 190 228
    C 190 206 207 191 227 191
    C 240 191 251 198 256 208
    C 261 198 272 191 285 191
    C 305 191 322 206 322 228
    C 322 256 298 280 256 312 Z"/>
  <circle cx="347" cy="165" r="24" fill="#5FBDBD"/>
</svg>
