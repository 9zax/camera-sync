<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CameraSync">
  <!-- CameraSync mark — Neo Kinpaku: gold leaf tile, lacquer glyph, patina sync dot -->
  <defs>
    <linearGradient id="cs-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C97E"/>
      <stop offset=".55" stop-color="#E2B15C"/>
      <stop offset="1" stop-color="#C99544"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#cs-gold)"/>
  <circle cx="256" cy="252" r="122" fill="none" stroke="#241E1A" stroke-width="24"/>
  <!-- sync dot on the ring — verdigris patina, the "live" accent -->
  <circle cx="352" cy="180" r="26" fill="#5FBDBD"/>
  <!-- heart shutter, lacquer -->
  <path fill="#241E1A" d="M256 316
    C 212 283 186 258 186 228
    C 186 206 203 190 224 190
    C 238 190 249 197 256 209
    C 263 197 274 190 288 190
    C 309 190 326 206 326 228
    C 326 258 300 283 256 316 Z"/>
</svg>
